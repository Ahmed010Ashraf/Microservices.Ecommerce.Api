services:
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: services/Catalog/Catalog.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - CatalogDb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DataBaseSettings__ConnectionString=mongodb://CatalogDb:27017
      - DataBaseSettings__DatabaseName=CatalogDb
      - DataBaseSettings__ProductCollection=Products
      - DataBaseSettings__BrandCollection=Brands
      - DataBaseSettings__TypeCollection=Types
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
      - Auth__Authority = "https://host.docker.internal:9009"
      - Auth__RequireHttpsMetadata=flase
      - Auth__Audience=Catalog
  CatalogDb:
    image: mongo
    container_name: CatalogDb
    ports:
       - "27017:27017"
    volumes:
       - catalogdata:/data/db
  BasketDb:
    image: redis:alpine
    container_name: BasketDb
    restart: always
    ports:
        - "6379:6379"
  discountdb:
    image: postgres
    container_name: discountdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password@1
      POSTGRES_DB: DiscountDb
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DiscountDb"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@ecommerce.com
      - PGADMIN_DEFAULT_PASSWORD=Password@1
    ports:
     - "5050:80"
    restart: always
    volumes:
      - pgadmin_data:/root/.pgadmin
  orderdb:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: orderdb
      environment:
        - ACCEPT_EULA=Y
        - MSSQL_SA_PASSWORD=P@assword123
      restart: always
      ports:
        - "1433:1433"
      volumes:
        - order_data:/var/opt/mssql
      healthcheck:
          test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'P@assword123' -Q 'SELECT 1'"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: services/Basket/Basket.Api/Dockerfile
    ports:
      - "8001:8080"
    depends_on:
      - rabbitmq
      - BasketDb
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CacheSetting__ConnectionString=BasketDb:6379
      - GrpcSettings__DiscountUrl=http://discount.api:8080
      - "EventBusSetting__HostAddress=amqp://guest:guest@rabbitmq:5672"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
  discount.api:
    image: ${DOCKER_REGISTRY-}discountapi
    build:
      context: .
      dockerfile: services/Discount/Discount.Api/Dockerfile
    container_name: discount.api
    depends_on:
       discountdb:
         condition: service_healthy
    environment:
        - DatabaseSetting__ConnectionString=server=discountdb;port=5432;Database=DiscountDb;User Id=admin;Password=Password@1;
        - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    ports:
       - "8002:8080"

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: services/Ordering/Ordering.Api/Dockerfile
    environment:
        - ASPNETCORE_URLS=http://+:8080
        - ConnectionStrings__OrderingConnectionString=Server=orderdb;Database=OrderingDb2;User Id=sa;Password=P@assword123;TrustServerCertificate=True;
        - "EventBusSetting__HostAddress=amqp://guest:guest@rabbitmq:5672"
        - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
       - orderdb
       - rabbitmq
    ports:
       - "8003:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

  ocelotapigateway:
    image: ${DOCKER_REGISTRY-}ocelotapigateway
    build:
      context: .
      dockerfile: ApiGateway/OcelotApiGateway/Dockerfile
    environment:
        - ASPNETCORE_URLS=http://+:8080
        - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - catalog.api
      - basket.api
      - discount.api
      - ordering.api
    ports:
      - "8010:8080" 
        

volumes:
  catalogdata:
  postgres_data:
  pgadmin_data:
  order_data:
  elasticsearch-data:





